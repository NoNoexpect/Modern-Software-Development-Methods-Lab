<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>个人研究助理</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #e5e7eb;
    --text: #16181d; --muted: #6b7280;
    --accent: #2f6fed; --accent-soft: #eaf1ff;
    --ok: #0f9d58; --code-bg: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.7;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .ghost {
    padding: 7px 14px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .skills { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .chip {
    padding: 3px 10px; border-radius: 999px; font-size: 12px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid #d6e2ff;
  }
  main { flex: 1; overflow-y: auto; padding: 24px; }
  .inner { max-width: 860px; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 12px 12px 2px 12px;
    background: var(--accent); color: #fff; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .answer {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 18px; word-break: break-word;
  }
  .msg.assistant .answer:empty { display: none; }
  .steps { margin-bottom: 8px; }
  .step {
    display: flex; gap: 10px; align-items: baseline; padding: 6px 12px; margin-bottom: 4px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; font-size: 12.5px;
  }
  .step.result { border-left-color: var(--ok); }
  .step.pending { border-left-color: #cbd5e1; color: var(--muted); }
  .step-name { font-weight: 700; color: var(--accent); flex: none; font-family: Consolas, monospace; }
  .step.result .step-name { color: var(--ok); }
  .step-detail { color: var(--muted); font-family: Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .error { color: #b42318; }
  .answer h1, .answer h2, .answer h3 { font-size: 15px; margin: 14px 0 6px; }
  .answer h1:first-child, .answer h2:first-child { margin-top: 0; }
  .answer p { margin: 8px 0; }
  .answer ul { margin: 8px 0; padding-left: 20px; }
  .answer li { margin: 3px 0; }
  .answer code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: 12.5px; }
  .answer pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .answer pre code { background: none; padding: 0; }
  .answer table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: 13px; }
  .answer th, .answer td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .answer th { background: #f8fafc; }
  .hint { color: var(--muted); text-align: center; padding: 40px 0; }
  .hint .title { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .hint .examples { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; align-items: center; }
  .hint button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; color: var(--text); font-size: 13px; text-align: left;
  }
  .hint button:hover { border-color: var(--accent); color: var(--accent); }
  .composer {
    display: flex; gap: 10px; padding: 14px 24px 18px; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  .composer textarea {
    flex: 1; resize: none; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; font-family: inherit; font-size: 14px; line-height: 1.6; outline: none;
  }
  .composer textarea:focus { border-color: var(--accent); }
  .composer button.primary {
    padding: 0 22px; border: none; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .composer button.primary:disabled { background: #a8c0f5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>个人研究助理</h1>
      <p class="sub">MCP + DeepSeek：读本地资料 · 联网检索 · 数据统计 · 写笔记</p>
    </div>
    <button class="ghost" id="resetBtn">重置对话</button>
  </header>

  <div class="skills" id="skills"></div>

  <main>
    <div class="inner" id="chat">
      <div class="hint" id="hint">
        <div class="title">问点什么，它自己去找资料</div>
        <div>Agent 会调用 MCP 技能：读文件、查网页、算数据、写笔记</div>
        <div class="examples" id="examples"></div>
      </div>
    </div>
  </main>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button class="primary" id="sendBtn" type="submit">发送</button>
  </form>

<script>
const chat = document.getElementById('chat');
const hint = document.getElementById('hint');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
let busy = false;

const EXAMPLES = [
  '读取 workspace 里的《概率论复习要点》，提炼要点并联网补充，最后存成笔记',
  '分析成绩表.csv，找出期末成绩最低的同学'
];

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ---------- 轻量 Markdown 渲染（标题 / 加粗 / 代码 / 列表 / 表格） ---------- */
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function splitRow(line) {
  return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
}
function mdToHtml(src) {
  const lines = escapeHtml(src).split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    // 表格：表头 + 分隔行
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
      html += '<table><thead><tr>' + head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>'
        + rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      continue;
    }
    // 标题
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { html += '<h3>' + inline(h[2]) + '</h3>'; i++; continue; }
    // 无序列表
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; }
      html += '<ul>' + items.map(t => '<li>' + inline(t) + '</li>').join('') + '</ul>';
      continue;
    }
    // 有序列表
    if (/^\s*\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++; }
      html += '<ul>' + items.map(t => '<li>' + inline(t) + '</li>').join('') + '</ul>';
      continue;
    }
    // 普通段落
    html += '<p>' + inline(line) + '</p>';
    i++;
  }
  return html;
}

/* ---------- 消息渲染 ---------- */
function toBottom() { const m = document.querySelector('main'); m.scrollTop = m.scrollHeight; }

function addUser(text) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div>';
  chat.appendChild(d); toBottom();
}

function newTurn() {
  const d = document.createElement('div');
  d.className = 'msg assistant';
  const steps = document.createElement('div'); steps.className = 'steps';
  const answer = document.createElement('div'); answer.className = 'answer';
  d.append(steps, answer);
  chat.appendChild(d); toBottom();
  return { steps: steps, answer: answer };
}

function addStep(steps, name, detail, kind) {
  const s = document.createElement('div');
  s.className = 'step ' + (kind || '');
  s.innerHTML = '<span class="step-name">' + escapeHtml(name) + '</span>'
    + '<span class="step-detail">' + escapeHtml(detail) + '</span>';
  steps.appendChild(s); toBottom();
  return s;
}

/* ---------- 事件处理 ---------- */
function handleEvent(ev, turn, pending) {
  if (ev.type === 'tool_call') {
    if (pending) pending.remove();
    addStep(turn.steps, ev.name, JSON.stringify(ev.arguments), 'call');
  } else if (ev.type === 'tool_result') {
    addStep(turn.steps, ev.name + ' 返回', ev.preview, 'result');
  } else if (ev.type === 'final') {
    if (pending) pending.remove();
    turn.answer.innerHTML = mdToHtml(ev.content);
    toBottom();
  } else if (ev.type === 'error') {
    if (pending) pending.remove();
    turn.answer.innerHTML = '<span class="error">' + escapeHtml(ev.content) + '</span>';
    toBottom();
  }
}

/* ---------- 发送 ---------- */
async function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  if (hint) hint.remove();
  addUser(text);

  const turn = newTurn();
  const pending = addStep(turn.steps, '正在思考', '', 'pending');
  busy = true; sendBtn.disabled = true;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const chunks = buffer.split('\n\n');
      buffer = chunks.pop();
      for (const chunk of chunks) {
        const line = chunk.trim();
        if (!line.startsWith('data:')) continue;
        handleEvent(JSON.parse(line.slice(5).trim()), turn, pending);
      }
    }
  } catch (err) {
    if (pending) pending.remove();
    turn.answer.innerHTML = '<span class="error">请求失败：' + escapeHtml(err.message) + '</span>';
  } finally {
    if (pending) pending.remove();
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

/* ---------- 初始化 ---------- */
document.getElementById('composer').addEventListener('submit', function (e) {
  e.preventDefault();
  send();
});
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('resetBtn').addEventListener('click', async function () {
  await fetch('/api/reset', { method: 'POST' });
  chat.innerHTML = '<div class="hint">对话已重置</div>';
  toBottom();
});

EXAMPLES.forEach(function (text) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = text;
  b.addEventListener('click', function () { input.value = text; input.focus(); });
  document.getElementById('examples').appendChild(b);
});

fetch('/api/tools').then(function (r) { return r.json(); }).then(function (data) {
  const box = document.getElementById('skills');
  data.tools.forEach(function (t) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = t.name;
    c.title = t.description;
    box.appendChild(c);
  });
}).catch(function () {
  document.getElementById('skills').textContent = '技能列表加载失败';
});

input.focus();
</script>
</body>
</html>
